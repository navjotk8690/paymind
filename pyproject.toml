[build-system]
requires=["setuptools>=69","wheel"]
build-backend="setuptools.build_meta"
[project]
name="navcore-paymind"
version="0.2.0"
description="Stateless, vendor-neutral payment decision intelligence framework"
readme="README.md"
requires-python=">=3.11,<3.13"
license={text="License decision pending; see LICENSE_DECISION.md"}
authors=[{name="NavCore"}]
dependencies=["fastapi>=0.115,<1","uvicorn[standard]>=0.30,<1","pydantic>=2.8,<3","numpy>=1.26,<3","PyYAML>=6,<7","catboost>=1.2.8,<2","pandas>=2.2,<3"]
[project.optional-dependencies]
training=["duckdb>=1.0,<2","scikit-learn>=1.5,<2"]
frontend=["gradio>=5,<7"]
hf=["huggingface_hub>=0.24,<1"]
space=["gradio>=5,<7","huggingface_hub>=0.24,<1"]
dev=["pytest>=8,<9","pytest-cov>=5,<7","httpx>=0.27,<1","ruff>=0.6,<1"]
all=["duckdb>=1.0,<2","scikit-learn>=1.5,<2","gradio>=5,<7","huggingface_hub>=0.24,<1","pytest>=8,<9","pytest-cov>=5,<7","httpx>=0.27,<1","ruff>=0.6,<1"]
[project.scripts]
paymind-api="paymind.api.app:run"
paymind-train-method="paymind.training.train_payment_method:main"
paymind-train-success="paymind.training.train_success:main"
paymind-train-arrival="paymind.training.train_arrival:main"
[tool.setuptools.packages.find]
where=["src"]
[tool.pytest.ini_options]
pythonpath=["src"]
testpaths=["tests"]
addopts="-q"
[tool.ruff]
line-length=110
target-version="py311"
